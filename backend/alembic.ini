# Alembic configuration (encoding: UTF-8; keep this file ASCII-only so that
# Windows GBK locale does not break configparser).
[alembic]
# Migration script directory (relative to backend/)
script_location = alembic
# Version file name template
file_template = %%(rev)s_%%(slug)s
# Timezone: UTC everywhere
timezone = UTC
truncate_slug_length = 40

# Database URL is injected by env.py from DATABASE_URL / Settings
sqlalchemy.url =

[post_write_hooks]
# No formatting hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
